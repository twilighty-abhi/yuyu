name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuyu
          POSTGRES_PASSWORD: yuyu_ci
          POSTGRES_DB: yuyu_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yuyu -d yuyu_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://yuyu:yuyu_ci@localhost:5432/yuyu_ci
      TEST_DATABASE_URL: postgresql://yuyu:yuyu_ci@localhost:5432/yuyu_ci
      AUTH_SECRET: ci-only-not-a-production-secret-0123456789
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-not-for-production-0123456789
      HEALTHCHECK_SECRET: ci-health-secret-not-for-production-012345
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      EMAIL_FROM: Yuyu CI <noreply@example.test>
      SMTP_SERVICE: test
      SMTP_ALLOW_UNAUTHENTICATED: "1"
      TRUSTED_PROXY_IP_HEADER: x-forwarded-for
      S3_BUCKET: yuyu-ci
      S3_REGION: us-east-1
      ALLOW_INSECURE_PRODUCTION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:deploy
      - run: npm run db:verify
      # The migrated database must match schema.prisma exactly (no drift).
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run production:check
      - run: npm run build
      - run: docker build --secret id=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" -t yuyu:ci .
      - name: Smoke-test standalone container
        run: |
          docker run -d --name yuyu-ci --network host \
            -e CI=true -e ALLOW_INSECURE_PRODUCTION_TESTS=1 \
            -e DATABASE_URL -e AUTH_SECRET -e AUTH_URL -e NEXT_PUBLIC_BASE_URL \
            -e REDIS_URL -e CRON_SECRET -e HEALTHCHECK_SECRET \
            -e NEXT_SERVER_ACTIONS_ENCRYPTION_KEY -e MFA_ENCRYPTION_KEY \
            -e EMAIL_FROM -e SMTP_SERVICE -e SMTP_ALLOW_UNAUTHENTICATED \
            -e TRUSTED_PROXY_IP_HEADER -e S3_BUCKET -e S3_REGION yuyu:ci
          # The server needs a few seconds to boot; a refused connection is retried too.
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health; then
            docker logs yuyu-ci
            docker rm -f yuyu-ci
            exit 1
          fi
          docker exec yuyu-ci node -e "require('sharp'); console.log('sharp loads in the image')"
          docker rm -f yuyu-ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production
        env:
          # The specs give each browser context its own client IP through
          # cf-connecting-ip so per-IP limits (10 sign-ins/min) don't couple tests.
          TRUSTED_PROXY_IP_HEADER: cf-connecting-ip
          # tests/e2e/webhooks.spec.ts posts to a local receiver; honoured by the
          # production build only with CI=true and ALLOW_INSECURE_PRODUCTION_TESTS=1.
          WEBHOOKS_ALLOW_PRIVATE_TARGETS: "1"
