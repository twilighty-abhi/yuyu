replicaCount: 1

# Pod replacement on upgrade. The default rolling update keeps the site up but
# runs the old and new release side by side for a moment. For an upgrade whose
# notes say the old release must not run against the new schema (see
# docs/production-operations.md, "Upgrading past 1.0"), set
# `updateStrategy: {type: Recreate, rollingUpdate: null}` for that one release
# (Helm merges maps, so clear rollingUpdate): a short outage, but no overlap.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: ghcr.io/your-org/yuyu
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Create this Secret outside Helm (External Secrets, Sealed Secrets, or kubectl).
# It must contain every production runtime variable in .env.example. It is
# mounted with envFrom on every app pod and on the migration Job, so all of them
# share one MFA_ENCRYPTION_KEY; keep that key stable, because it decrypts the
# SMTP/Google/alert-webhook secrets saved in Super admin -> Settings.
existingSecret: yuyu-runtime

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: events.dev.idliapps.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

migration:
  # Enable for production releases after publishing the Docker `migrator` target.
  enabled: true
  image:
    repository: ghcr.io/your-org/yuyu-migrator
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 300
  # After migrating, run scripts/check-instance-secrets.mjs and fail the release
  # if MFA_ENCRYPTION_KEY cannot decrypt secrets already saved in Super admin ->
  # Settings (rotated or mismatched key). Requires a migrator image built from a
  # Dockerfile that copies the script (this repository's, from this version on).
  checkInstanceSecrets: false

nodeSelector: {}
tolerations: []
affinity: {}
