openapi: 3.1.0
info:
  title: Yuyu Mobile API
  version: "1.0.0"
  summary: User-authenticated REST API for the Yuyu mobile apps (Android and iOS).
  description: |
    Machine-readable contract for `/api/mobile/v1`. The prose guide is
    `docs/MOBILE_API.md`. Response payloads are validated on the server by the
    strict Zod schemas in `lib/mobile/schemas.ts`; `tests/unit/mobile-api-contract.test.ts`
    checks the fixtures in `docs/mobile-api-fixtures/` against both this file
    and those schemas, and checks that every path here has a route handler.

    Every response is JSON with `Cache-Control: no-store`. Success:
    `{ "ok": true, "data": ... }`. Failure: `ErrorEnvelope`.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://yuyu.example
        description: The Yuyu instance origin (`NEXT_PUBLIC_BASE_URL`).
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Public
  - name: Organiser
  - name: Check-in
  - name: Emails
  - name: Day-of
  - name: Reused web endpoints
  - name: App links

paths:
  /api/mobile/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 128 }
                totp: { type: string, maxLength: 32, description: Authenticator code or recovery code. }
                deviceName: { type: string, maxLength: 120 }
                platform: { $ref: "#/components/schemas/Platform" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "`MFA_REQUIRED` (only after a correct password).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "403": { description: "`EMAIL_VERIFICATION_REQUIRED`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/google:
    post:
      tags: [Auth]
      summary: Exchange a Google ID token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idToken]
              properties:
                idToken: { type: string, maxLength: 8192 }
                deviceName: { type: string, maxLength: 120 }
                platform: { $ref: "#/components/schemas/Platform" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: Token failed verification., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "403": { description: Google sign-in not configured, account creation disabled, or linking refused., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Returns new access and refresh tokens. Replaying the previous refresh
        token within 30 seconds of a rotation (a lost response) is a plain 401;
        later replays revoke the session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current mobile session
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "401": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere (web and mobile)
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/config:
    get:
      tags: [Auth]
      summary: Public instance configuration for the sign-in screen
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthConfigResponse" } } } }

  /api/mobile/v1/me:
    get:
      tags: [Me]
      summary: The signed-in user, organisations and event collaborations
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MeResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Me]
      summary: Update the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations:
    get:
      tags: [Me]
      summary: The caller's own registrations and certificates
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations/{rsvpId}/cancel:
    post:
      tags: [Me]
      summary: Cancel one of the caller's own RSVPs
      parameters: [{ $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/discover:
    get:
      tags: [Public]
      summary: Upcoming publicly listed events
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/search:
    get:
      tags: [Public]
      summary: Search publicly listed events (same rules as /api/search, max 48)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/short/{code}:
    get:
      tags: [Public]
      summary: Resolve an event short link
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, minLength: 7, maxLength: 7 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ShortLinkResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/events/{orgSlug}/{eventSlug}:
    get:
      tags: [Public]
      summary: Public event page as data
      description: A bearer token, if sent, identifies the viewer (invite-only access, `myRsvp`). An invalid bearer is 401.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventSlug" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicEventResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/events/{orgSlug}/{eventSlug}/feedback:
    get:
      tags: [Public]
      summary: The open feedback form
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventSlug" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackFormResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/rsvp:
    post:
      tags: [Public]
      summary: Register for an event (same body and rules as POST /api/rsvp)
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgSlug]
              properties:
                orgSlug: { type: string }
                eventSlug: { type: string }
                eventInstanceId: { type: string }
                name: { type: string, description: Required for guests; optional for signed-in users who already have a name. }
                guestEmail: { type: string, format: email, description: Guests only. }
                answers: { type: object, additionalProperties: true, description: "Keyed by registration field `key`." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RsvpResultResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events:
    get:
      tags: [Organiser]
      summary: Events the caller can work on in this organisation
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { name: filter, in: query, schema: { type: string, enum: [upcoming, past, all], default: upcoming } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgEventsResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}:
    get:
      tags: [Organiser]
      summary: Organiser event detail
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgEventDetailResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests:
    get:
      tags: [Organiser]
      summary: Guest list (organisation admins or CHECK_IN holders)
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: status, in: query, schema: { type: string, enum: [ALL, CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED], default: ALL } }
        - { name: checkedIn, in: query, schema: { type: string, enum: [any, "yes", "no"], default: any } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestListResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Organiser]
      summary: Add a guest (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                answers: { type: object, additionalProperties: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/restore:
    post:
      tags: [Organiser]
      summary: Undo a guest deletion within five minutes (404 unless the undo belongs to this event)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [undoId], properties: { undoId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}:
    get:
      tags: [Organiser]
      summary: One guest with registration answers
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestDetailResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Organiser]
      summary: Delete a guest (organisation admins); returns an undo id
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UndoResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/approve:
    post:
      tags: [Organiser]
      summary: Approve a pending request (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/reject:
    post:
      tags: [Organiser]
      summary: Reject a pending or waitlisted guest (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/promote:
    post:
      tags: [Organiser]
      summary: Promote a waitlisted guest (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/reaccept:
    post:
      tags: [Organiser]
      summary: Re-accept a declined guest (organisation admins); confirmed when there is room, otherwise waitlisted
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/preview:
    post:
      tags: [Check-in]
      summary: Look up a ticket before checking in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `rawInput` or `rsvpId`.
              properties:
                rawInput: { type: string, maxLength: 2048, description: QR payload, ticket URL or typed code. }
                rsvpId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInPreviewResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in:
    post:
      tags: [Check-in]
      summary: Check a guest in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `rawInput` (source `mobile-scan`) or `rsvpId` (source `mobile-manual`).
              properties:
                rawInput: { type: string, maxLength: 2048 }
                rsvpId: { type: string }
                force: { type: boolean, default: false }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInResultResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`NEEDS_FORCE` (retry with `force: true`) or `CONFLICT`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/undo:
    post:
      tags: [Check-in]
      summary: Undo a check-in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [rsvpId], properties: { rsvpId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/lookup:
    get:
      tags: [Check-in]
      summary: Search guests at the door (max 12)
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LookupResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/stats:
    get:
      tags: [Check-in]
      summary: Door counts and the ten latest check-ins
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInStatsResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/roster:
    get:
      tags: [Check-in]
      summary: Offline roster (includes ticket tokens; CHECK_IN only)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RosterResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/sync:
    post:
      tags: [Check-in]
      summary: Upload offline check-ins
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkIns]
              properties:
                checkIns:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [rsvpId, checkedInAt]
                    properties:
                      rsvpId: { type: string }
                      checkedInAt: { type: string, format: date-time }
                      force: { type: boolean, default: false }
                      clientMutationId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts/meta:
    get:
      tags: [Emails]
      summary: Templates, designs, placeholders and history (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastsMetaResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts/count:
    post:
      tags: [Emails]
      summary: Count recipients for an audience
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastAudience" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastCountResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts/preview:
    post:
      tags: [Emails]
      summary: Server-rendered preview with example values
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastContent" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastPreviewResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts/test:
    post:
      tags: [Emails]
      summary: Send a test to the caller's own verified inbox
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastContent" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastTestResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts:
    post:
      tags: [Emails]
      summary: Queue a broadcast
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statuses, subject, body]
              properties:
                statuses: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/RsvpStatus" } }
                attendance: { $ref: "#/components/schemas/Attendance" }
                subject: { type: string, minLength: 1, maxLength: 150 }
                body: { type: string, minLength: 1, maxLength: 20000 }
                design: { type: string, enum: [classic, minimal, accent, photo, letter], default: classic }
      responses:
        "201": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/BroadcastSendResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/schedule:
    get:
      tags: [Day-of]
      summary: Organiser programme with stored live delays (PUBLISH_AND_SCHEDULE)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/schedule/sessions/{sessionId}/delay:
    post:
      tags: [Day-of]
      summary: Set a session's live delay
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [delayMinutes], properties: { delayMinutes: { type: integer, minimum: 0, maximum: 1440 } } }
      responses:
        "200": { $ref: "#/components/responses/Null" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/feedback/state:
    post:
      tags: [Day-of]
      summary: Open or close the feedback form (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [open], properties: { open: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackStateResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/registration/state:
    post:
      tags: [Day-of]
      summary: Close sign-ups now, or reopen them after a mobile close (organisation admins)
      description: |
        Closing stores the organiser's cutoff and sets `registrationClosesAt` to
        min(now, event start). Reopening is allowed only while
        `registrationManuallyClosed` is true and restores the stored cutoff
        (which may itself have passed: then `registrationOpen` is false with a
        reason); otherwise 409 `CONFLICT`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [open], properties: { open: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationStateResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/ticket/{token}/status:
    get:
      tags: [Reused web endpoints]
      summary: Live ticket check-in state (per-IP rate limited)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK (not enveloped)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [checkedIn, checkedInAt]
                properties:
                  checkedIn: { type: boolean }
                  checkedInAt: { type: [string, "null"], format: date-time }
        "404": { description: Unknown or malformed token (empty body). }
        "429": { description: Rate limited. }

  /api/ticket/{token}/events:
    get:
      tags: [Reused web endpoints]
      summary: Server-sent events stream of the ticket's check-in state
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "`text/event-stream` of `{ checkedIn, checkedInAt }` messages.", content: { text/event-stream: { schema: { type: string } } } }
        "404": { description: Unknown or malformed token. }
        "429": { description: Rate limited. }

  /api/feedback:
    post:
      tags: [Reused web endpoints]
      summary: Submit feedback (not enveloped like the mobile API)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orgSlug, eventSlug]
              properties:
                orgSlug: { type: string }
                eventSlug: { type: string }
                email: { type: string, format: email, description: Required when certificates are enabled. }
                answers: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  data: { type: object, properties: { certificateToken: { type: [string, "null"] } } }
        "400": { description: "`{ ok: false, error: string }`." }
        "413": { description: Body over 128 KiB. }
        "429": { description: Rate limited. }

  /api/feedback/certificate/{token}:
    get:
      tags: [Reused web endpoints]
      summary: Certificate JPEG
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: JPEG image., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { description: Unknown token. }

  /api/check-in/station:
    post:
      tags: [Reused web endpoints]
      summary: Venue check-in station (cookie-based station proof; keep a per-station cookie jar)
      security: []
      description: See `app/api/check-in/station/route.ts`. Not part of the bearer-authenticated mobile API.
      responses:
        "200": { description: Station operation result. }
        "401": { description: Missing or invalid station proof. }
        "429": { description: Rate limited. }

  /.well-known/assetlinks.json:
    get:
      tags: [App links]
      summary: Android Digital Asset Links (package com.twilighty.yuyu)
      security: []
      responses:
        "200": { description: "Statement list; `[]` when `ANDROID_APP_SHA256_CERT_FINGERPRINTS` is unset.", content: { application/json: { schema: { type: array } } } }

  /.well-known/apple-app-site-association:
    get:
      tags: [App links]
      summary: Apple App Site Association (bundle com.twilighty.yuyu)
      security: []
      responses:
        "200": { description: "Claims `/ticket/*`, `/*/*/feedback` and `/*/*` after excluding application paths (see MOBILE_API.md); `{ applinks: { details: [] } }` when `APPLE_APP_IDS` is unset.", content: { application/json: { schema: { type: object } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token from a `Session` (prefix `yma_`, 15 minutes). Refresh once on 401, then sign out."

  parameters:
    orgSlug: { name: orgSlug, in: path, required: true, schema: { type: string } }
    eventSlug: { name: eventSlug, in: path, required: true, schema: { type: string } }
    eventId: { name: eventId, in: path, required: true, schema: { type: string } }
    rsvpId: { name: rsvpId, in: path, required: true, schema: { type: string } }

  responses:
    Error:
      description: Error envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Null:
      description: OK
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: "null" } } }
    Session:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } }

  schemas:
    Platform: { type: string, enum: [android, ios] }
    RsvpStatus: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED] }
    EventStatus: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN, CANCELLED] }
    PrivacyType: { type: string, enum: [PUBLIC, HIDDEN_LINK, APPROVAL_REQUIRED, INVITE_ONLY] }
    MembershipRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
    EventPermission: { type: string, enum: [EDIT_DETAILS, MANAGE_REGISTRATIONS, MANAGE_INVITATIONS, CHECK_IN, PUBLISH_AND_SCHEDULE] }
    FieldType: { type: string, enum: [TEXT, TEXTAREA, EMAIL, PHONE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, NUMBER, DATE] }
    Attendance: { type: string, enum: [ANY, CHECKED_IN, NOT_CHECKED_IN], default: ANY }
    DateTime: { type: string, format: date-time }
    NullableDateTime: { type: [string, "null"], format: date-time }
    NullableUrl: { type: [string, "null"], format: uri }

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, MFA_REQUIRED, EMAIL_VERIFICATION_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, NEEDS_FORCE, RATE_LIMITED, INTERNAL_ERROR] }
            message: { type: string, description: UI-safe text. }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, imageUrl, emailVerified, mfaEnabled]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        imageUrl: { $ref: "#/components/schemas/NullableUrl" }
        emailVerified: { type: boolean }
        mfaEnabled: { type: boolean }

    Session:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        user: { $ref: "#/components/schemas/User" }

    AuthConfig:
      type: object
      additionalProperties: false
      required: [instanceName, googleSignIn, signupEnabled, baseUrl]
      properties:
        instanceName: { type: string }
        googleSignIn:
          type: object
          additionalProperties: false
          required: [enabled, webClientId]
          properties:
            enabled: { type: boolean }
            webClientId: { type: [string, "null"] }
        signupEnabled: { type: boolean }
        baseUrl: { type: string, format: uri }

    OrgSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, logoUrl, role]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        logoUrl: { $ref: "#/components/schemas/NullableUrl" }
        role: { $ref: "#/components/schemas/MembershipRole" }

    Collaboration:
      type: object
      additionalProperties: false
      required: [organisation, eventId, eventTitle, permissions]
      properties:
        organisation: { type: object, additionalProperties: false, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        eventId: { type: string }
        eventTitle: { type: string }
        permissions: { type: array, items: { $ref: "#/components/schemas/EventPermission" } }

    Me:
      type: object
      additionalProperties: false
      required: [user, organisations, collaborations]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organisations: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
        collaborations: { type: array, items: { $ref: "#/components/schemas/Collaboration" } }

    EventSummary:
      type: object
      additionalProperties: false
      required: [id, slug, title, coverImageUrl, startDateTime, endDateTime, timezone, location, mapLinkUrl, isOnline, accentColor, status, organisation]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        coverImageUrl: { $ref: "#/components/schemas/NullableUrl" }
        startDateTime: { $ref: "#/components/schemas/DateTime" }
        endDateTime: { $ref: "#/components/schemas/DateTime" }
        timezone: { type: string, description: IANA time zone. }
        location: { type: string }
        mapLinkUrl: { type: [string, "null"] }
        isOnline: { type: boolean }
        accentColor: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        organisation:
          type: object
          additionalProperties: false
          required: [slug, name, logoUrl]
          properties:
            slug: { type: string }
            name: { type: string }
            logoUrl: { $ref: "#/components/schemas/NullableUrl" }

    EventList:
      type: object
      additionalProperties: false
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } }
        nextCursor: { type: [string, "null"] }

    Registration:
      type: object
      additionalProperties: false
      required: [rsvpId, status, checkedInAt, registeredAt, canCancel, ticketToken, event, instanceId]
      properties:
        rsvpId: { type: string }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        canCancel: { type: boolean }
        ticketToken: { type: [string, "null"], description: Only for CONFIRMED registrations. }
        event: { $ref: "#/components/schemas/EventSummary" }
        instanceId: { type: [string, "null"], description: Set for a recurring-series occurrence; `event` then describes the series. }

    Registrations:
      type: object
      additionalProperties: false
      required: [upcoming, past, certificates]
      properties:
        upcoming: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        past: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        certificates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [eventTitle, organisationName, issuedAt, certificateUrl]
            properties:
              eventTitle: { type: string }
              organisationName: { type: string }
              issuedAt: { $ref: "#/components/schemas/DateTime" }
              certificateUrl: { type: string, format: uri }

    ShortLink:
      type: object
      additionalProperties: false
      required: [orgSlug, eventSlug]
      properties:
        orgSlug: { type: string }
        eventSlug: { type: string }

    RegistrationField:
      type: object
      additionalProperties: false
      required: [id, key, label, type, required, helpText, placeholder, options, settings, showIf]
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/FieldType" }
        required: { type: boolean }
        helpText: { type: [string, "null"] }
        placeholder: { type: [string, "null"] }
        options: { type: array, items: { type: string } }
        settings:
          type: object
          additionalProperties: false
          properties:
            minLength: { type: integer }
            maxLength: { type: integer }
            min: { type: number }
            max: { type: number }
            minDate: { type: string, description: YYYY-MM-DD }
            maxDate: { type: string, description: YYYY-MM-DD }
            maxSelections: { type: integer }
            allowOther: { type: boolean }
        showIf:
          type: [object, "null"]
          additionalProperties: false
          required: [fieldKey, values]
          description: Show only when the earlier field `fieldKey` has one of `values` (CHECKBOX answers are "Yes"/"No").
          properties:
            fieldKey: { type: string }
            values: { type: array, items: { type: string } }

    PublicEvent:
      type: object
      additionalProperties: false
      required: [event, registration, schedule, speakers, feedbackOpen]
      properties:
        event:
          allOf:
            - { $ref: "#/components/schemas/EventSummary" }
            - type: object
              required: [description, tags, capacity, showRegistrationCount, confirmedCount, privacyType, registrationOpen, registrationFull, registrationClosedReason, onlineUrl]
              properties:
                description: { type: string }
                tags: { type: array, items: { type: string } }
                capacity: { type: [integer, "null"] }
                showRegistrationCount: { type: boolean }
                confirmedCount: { type: [integer, "null"], description: Null when the organiser hides counts. }
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationFull: { type: boolean }
                registrationClosedReason: { type: [string, "null"] }
                onlineUrl: { type: [string, "null"], description: Always null; Yuyu does not store a separate joining URL. }
        registration:
          type: object
          additionalProperties: false
          required: [requiresApproval, fields, myRsvp]
          properties:
            requiresApproval: { type: boolean }
            fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }
            myRsvp:
              type: [object, "null"]
              additionalProperties: false
              required: [rsvpId, status, ticketToken]
              properties:
                rsvpId: { type: string }
                status: { $ref: "#/components/schemas/RsvpStatus" }
                ticketToken: { type: [string, "null"] }
        schedule:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [trackName, sessions]
            properties:
              trackName: { type: [string, "null"] }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, startDateTime, endDateTime, delayMinutes, room, speakers]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: Minutes this session is running late; start/end already include it. }
                    room: { type: [string, "null"] }
                    speakers: { type: array, items: { type: string } }
        speakers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, title, photoUrl]
            properties:
              name: { type: string }
              title: { type: [string, "null"] }
              photoUrl: { $ref: "#/components/schemas/NullableUrl" }
        feedbackOpen: { type: boolean }

    RsvpResult:
      type: object
      additionalProperties: false
      required: [rsvpId, status, ticketToken]
      properties:
        rsvpId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL] }
        ticketToken: { type: [string, "null"] }

    FeedbackForm:
      type: object
      additionalProperties: false
      required: [title, intro, thankYouMessage, open, certificatesEnabled, fields]
      properties:
        title: { type: string }
        intro: { type: [string, "null"] }
        thankYouMessage: { type: string }
        open: { const: true }
        certificatesEnabled: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }

    EventPermissions:
      type: object
      additionalProperties: false
      required: [checkIn, manageRegistrations, sendEmails, schedule, manageFeedback, manageRegistrationWindow]
      properties:
        checkIn: { type: boolean }
        manageRegistrations: { type: boolean }
        sendEmails: { type: boolean }
        schedule: { type: boolean }
        manageFeedback: { type: boolean }
        manageRegistrationWindow: { type: boolean }

    EventCounts:
      type: object
      additionalProperties: false
      required: [confirmed, waitlisted, pending, checkedIn, capacity]
      properties:
        confirmed: { type: integer }
        waitlisted: { type: integer }
        pending: { type: integer }
        checkedIn: { type: integer }
        capacity: { type: [integer, "null"] }

    OrgEvents:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EventSummary" }
              - type: object
                required: [counts, myPermissions]
                properties:
                  counts:
                    oneOf:
                      - { $ref: "#/components/schemas/EventCounts" }
                      - { type: "null" }
                  myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    OrgEventDetail:
      type: object
      additionalProperties: false
      required: [event, counts, myPermissions]
      properties:
        event:
          allOf:
            - { $ref: "#/components/schemas/EventSummary" }
            - type: object
              required: [privacyType, registrationOpen, registrationClosesAt, registrationClosedReason, registrationManuallyClosed, feedbackOpen, eventUrl, shortUrl]
              properties:
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationClosesAt: { $ref: "#/components/schemas/NullableDateTime" }
                registrationClosedReason: { type: [string, "null"] }
                registrationManuallyClosed: { type: boolean, description: Sign-ups were closed from a mobile app and can be reopened there. }
                feedbackOpen: { type: boolean }
                eventUrl: { type: string, format: uri }
                shortUrl: { $ref: "#/components/schemas/NullableUrl" }
        counts:
          oneOf:
            - { $ref: "#/components/schemas/EventCounts" }
            - { type: "null" }
        myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    Guest:
      type: object
      additionalProperties: false
      required: [rsvpId, displayName, email, status, checkedInAt, registeredAt, isGuest]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        isGuest: { type: boolean, description: True when the registration has no Yuyu account. }

    Detail:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    GuestList:
      type: object
      additionalProperties: false
      required: [guests, nextCursor]
      properties:
        guests: { type: array, items: { $ref: "#/components/schemas/Guest" } }
        nextCursor: { type: [string, "null"] }

    GuestDetail:
      allOf:
        - { $ref: "#/components/schemas/Guest" }
        - type: object
          required: [answers]
          properties:
            answers: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Undo:
      type: object
      additionalProperties: false
      required: [undoId]
      properties:
        undoId: { type: string }

    CheckInResult:
      type: object
      additionalProperties: false
      required: [rsvpId, displayName, email, status, alreadyCheckedIn, checkedInAt, checkInDetails, registrationDetails]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        alreadyCheckedIn: { type: boolean }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
        registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    CheckInPreview:
      allOf:
        - { $ref: "#/components/schemas/CheckInResult" }
        - type: object
          required: [gate]
          properties:
            gate:
              oneOf:
                - { type: object, additionalProperties: false, required: [ok], properties: { ok: { const: true } } }
                - type: object
                  additionalProperties: false
                  required: [ok, reason, needsForce]
                  properties:
                    ok: { const: false }
                    reason: { type: string }
                    needsForce: { type: boolean }
                    blocked: { type: boolean }

    Lookup:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/Guest" } }

    CheckInStats:
      type: object
      additionalProperties: false
      required: [confirmed, checkedIn, recent]
      properties:
        confirmed: { type: integer }
        checkedIn: { type: integer }
        recent:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rsvpId, displayName, checkedInAt]
            properties:
              rsvpId: { type: string }
              displayName: { type: string }
              checkedInAt: { $ref: "#/components/schemas/DateTime" }

    RosterRow:
      allOf:
        - { $ref: "#/components/schemas/Guest" }
        - type: object
          required: [ticketToken, checkInDetails, registrationDetails]
          properties:
            ticketToken: { type: string, description: Bearer capability; never log or persist outside the encrypted offline store. }
            checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
            registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Roster:
      type: object
      additionalProperties: false
      required: [generatedAt, rows]
      properties:
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        rows: { type: array, items: { $ref: "#/components/schemas/RosterRow" } }

    SyncResult:
      type: object
      additionalProperties: false
      required: [syncedIds, alreadyCheckedInIds, failed]
      properties:
        syncedIds: { type: array, items: { type: string } }
        alreadyCheckedInIds: { type: array, items: { type: string } }
        failed:
          type: array
          items: { type: object, additionalProperties: false, required: [rsvpId, error], properties: { rsvpId: { type: string }, error: { type: string } } }

    BroadcastAudience:
      type: object
      additionalProperties: false
      required: [statuses]
      properties:
        statuses: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    BroadcastContent:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 20000, description: "Supported HTML subset: p, strong, em, h2, h3, ul, ol, li, blockquote, a, a.cta, br." }
        design: { type: string, enum: [classic, minimal, accent, photo, letter], default: classic }

    BroadcastsMeta:
      type: object
      additionalProperties: false
      required: [templates, designs, placeholders, history]
      properties:
        templates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, group, name, description, subject, bodyHtml, audience]
            properties:
              id: { type: string }
              group: { type: string }
              name: { type: string }
              description: { type: string }
              subject: { type: string }
              bodyHtml: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
        designs:
          type: array
          items: { type: object, additionalProperties: false, required: [id, label, description], properties: { id: { type: string }, label: { type: string }, description: { type: string } } }
        placeholders: { type: array, items: { type: string } }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, subject, design, audience, recipientCount, sentAt, bodyHtml]
            properties:
              id: { type: string }
              subject: { type: string }
              design: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
              recipientCount: { type: integer }
              sentAt: { $ref: "#/components/schemas/DateTime" }
              bodyHtml: { type: string }

    StoredAudience:
      type: object
      additionalProperties: false
      required: [statuses, attendance]
      properties:
        statuses: { type: array, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    Schedule:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, sessions]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, startDateTime, endDateTime, delayMinutes]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: The session's stored live delay (what the delay control sets); planned times are unchanged. }

    # Success envelopes
    SessionResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Session" } } }
    AuthConfigResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/AuthConfig" } } }
    MeResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Me" } } }
    UserResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/User" } } }
    RegistrationsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Registrations" } } }
    EventListResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/EventList" } } }
    ShortLinkResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/ShortLink" } } }
    PublicEventResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/PublicEvent" } } }
    FeedbackFormResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/FeedbackForm" } } }
    RsvpResultResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/RsvpResult" } } }
    OrgEventsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/OrgEvents" } } }
    OrgEventDetailResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/OrgEventDetail" } } }
    GuestListResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/GuestList" } } }
    GuestResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Guest" } } }
    GuestDetailResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/GuestDetail" } } }
    UndoResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Undo" } } }
    CheckInResultResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInResult" } } }
    CheckInPreviewResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInPreview" } } }
    LookupResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Lookup" } } }
    CheckInStatsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInStats" } } }
    RosterResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Roster" } } }
    SyncResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/SyncResult" } } }
    BroadcastsMetaResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/BroadcastsMeta" } } }
    BroadcastCountResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [count], properties: { count: { type: integer } } } } }
    BroadcastPreviewResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [subject, html, text], properties: { subject: { type: string }, html: { type: string }, text: { type: string } } } } }
    BroadcastTestResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [to], properties: { to: { type: string } } } } }
    BroadcastSendResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [broadcastId, recipientCount], properties: { broadcastId: { type: string }, recipientCount: { type: integer } } } } }
    ScheduleResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Schedule" } } }
    FeedbackStateResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [open], properties: { open: { type: boolean } } } } }
    RegistrationState:
      type: object
      additionalProperties: false
      required: [registrationOpen, registrationClosesAt, registrationClosedReason, registrationManuallyClosed]
      properties:
        registrationOpen: { type: boolean }
        registrationClosesAt: { $ref: "#/components/schemas/NullableDateTime" }
        registrationClosedReason: { type: [string, "null"], description: UI-safe reason when registration is closed. }
        registrationManuallyClosed: { type: boolean }
    RegistrationStateResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/RegistrationState" } } }
